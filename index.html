<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>訂單查詢</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
  :root{ --brand:#8C7B6C; --brand-dark:#6f6052; --cream:#FDFBF7; --line:#ece7df; --ink:#3d3a36; --muted:#9b938a; }
  *{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body{ margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC",Roboto,sans-serif; background:var(--cream); color:var(--ink); }
  .wrap{ max-width:560px; margin:0 auto; padding:0 14px 40px; }
  header{ position:sticky; top:0; z-index:5; background:var(--cream); padding:16px 14px 12px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid var(--line); }
  .logo{ font-weight:800; letter-spacing:.5px; }
  .logo small{ display:block; font-weight:500; font-size:11px; color:var(--muted); letter-spacing:2px; }
  .me{ display:flex; align-items:center; gap:8px; font-size:13px; color:var(--muted); }
  .me img{ width:30px; height:30px; border-radius:50%; object-fit:cover; }
  .card{ background:#fff; border:1px solid var(--line); border-radius:18px; padding:16px; margin-top:14px; box-shadow:0 1px 0 rgba(0,0,0,.02); }
  .muted{ color:var(--muted); }
  .center{ text-align:center; }
  .btn{ display:inline-flex; align-items:center; justify-content:center; gap:6px; border:none; border-radius:14px; padding:12px 18px; font-size:15px; font-weight:700; cursor:pointer; background:var(--brand); color:#fff; }
  .btn.ghost{ background:#fff; color:var(--brand); border:1px solid var(--line); }
  .btn.block{ width:100%; }
  .input{ width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:14px; font-size:15px; outline:none; background:#fff; }
  .input:focus{ border-color:var(--brand); }
  .spin{ width:30px; height:30px; border:3px solid var(--line); border-top-color:var(--brand); border-radius:50%; animation:s 1s linear infinite; margin:30px auto; }
  @keyframes s{ to{ transform:rotate(360deg); } }
  .ord-head{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .ord-id{ font-weight:800; font-size:15px; }
  .ord-date{ font-size:12px; color:var(--muted); margin-top:2px; }
  .badge{ font-size:12px; font-weight:800; padding:5px 10px; border-radius:10px; white-space:nowrap; }
  .b-wait{ background:#FFF4E5; color:#C8741A; } .b-part{ background:#E9F1FF; color:#2E6BD6; } .b-done{ background:#E9F7EC; color:#2E8B45; }
  .pay{ font-size:11px; font-weight:800; padding:3px 8px; border-radius:8px; }
  .pay-ok{ background:#E9F7EC; color:#2E8B45; } .pay-no{ background:#FBECEC; color:#C84A4A; }
  .item{ padding:12px 0; border-top:1px solid var(--line); }
  .item:first-child{ border-top:none; }
  .item-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:10px; }
  .item-thumb{ width:64px; height:64px; border-radius:12px; object-fit:cover; border:1px solid var(--line); flex-shrink:0; background:#f4f0ea; cursor:pointer; }
  .lightbox{ position:fixed; inset:0; background:rgba(0,0,0,.85); z-index:50; display:flex; align-items:center; justify-content:center; padding:24px; }
  .lightbox img{ max-width:100%; max-height:100%; border-radius:12px; }
  .item-name{ font-size:14px; font-weight:700; line-height:1.4; }
  .item-qty{ font-size:13px; color:var(--muted); white-space:nowrap; }
  .steps{ display:flex; align-items:center; gap:0; margin-top:10px; }
  .seg{ flex:1; height:5px; border-radius:3px; background:var(--line); }
  .seg.on{ background:var(--brand); }
  .seg.off{ background:var(--line); }
  .step-labels{ display:flex; justify-content:space-between; margin-top:6px; }
  .step-labels span{ font-size:10px; color:var(--muted); flex:1; text-align:center; }
  .step-labels span.cur{ color:var(--brand); font-weight:800; }
  .stockout{ display:inline-block; margin-top:8px; font-size:12px; font-weight:800; color:#C84A4A; background:#FBECEC; padding:4px 10px; border-radius:8px; }
  .track{ display:inline-flex; align-items:center; gap:5px; margin-top:8px; margin-right:6px; font-size:12px; font-weight:800; color:var(--brand); background:#F4F0EA; border:1px solid var(--line); border-radius:10px; padding:6px 10px; text-decoration:none; }
  .ord-foot{ display:flex; align-items:center; justify-content:space-between; margin-top:14px; padding-top:12px; border-top:1px solid var(--line); }
  .total{ font-size:13px; color:var(--muted); } .total b{ color:var(--ink); font-size:16px; }
  .due{ font-size:13px; color:#C8741A; font-weight:800; }
  .money-rows{ display:flex; flex-direction:column; align-items:flex-end; gap:4px; }
  .money-row{ font-size:12px; font-weight:800; display:flex; align-items:center; gap:5px; }
  .money-row .lbl{ color:var(--muted); font-weight:600; }
  .money-row .paid{ color:#2E8B45; }
  .money-row .unpaid{ color:#C8741A; }
  /* ✅ 包裹分組 */
  .pkg{ border:1px solid var(--line); border-radius:14px; padding:12px 14px; margin-top:10px; background:#fff; }
  .pkg-head{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
  .pkg-name{ font-weight:800; font-size:14px; }
  .pkg-date{ font-size:12px; color:var(--muted); font-weight:600; }
  .pkg-list{ margin-top:8px; font-size:13px; color:#444; line-height:1.7; }
  .pkg-list .oid{ color:var(--muted); font-size:11px; font-weight:700; }
  .tag-pkg{ display:inline-block; font-size:11px; font-weight:800; padding:2px 8px; border-radius:999px;
            background:#EAF4EC; color:#2E8B45; margin-top:6px; }
  .tag-wait{ background:#FBF0E2; color:#C8741A; }
  .merge-note{ font-size:11px; color:var(--muted); font-weight:600; margin-top:3px; }
  .cand{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px; border:1px solid var(--line); border-radius:14px; margin-top:10px; }
  .cand b{ font-size:15px; } .cand .sub{ font-size:12px; color:var(--muted); margin-top:2px; }
  .pill{ font-size:11px; font-weight:800; color:var(--brand); background:#F4F0EA; padding:6px 10px; border-radius:10px; }
</style>
</head>
<body>
<header>
  <div class="logo" id="headerLogo">訂單查詢<small>ORDER STATUS</small></div>
  <div class="me" id="me"></div>
</header>
<div class="wrap" id="app">
  <div class="spin"></div>
</div>

<script>
/* ========= 設定 ========= */
const GAS_URL = "https://script.google.com/macros/s/AKfycbzVrGHrtZh44PSTDA8K58opzMUFOshKwh8b9EA72D9kRI4f-dvGvCfmxbDir2_4aXNfSQ/exec";
const LIFF_ID = "2008786061-Xv68Z47v";
const OA_ID = "@755kygtt";

// ✅ Partner Mode：URL 帶 ?mode=partner 時隱藏品牌資訊
const IS_PARTNER = new URLSearchParams(window.location.search).get('mode') === 'partner';

// ✅ 非 Partner mode 才顯示 CJ Studio 品牌
if (!IS_PARTNER) {
  document.title = 'CJ Studio 訂單查詢';
  document.getElementById('headerLogo').innerHTML = 'CJ STUDIO<small>訂單查詢</small>';
}

/* ==========================================  */

const STAGES = ['待下訂','已下訂','已集運','已抵台','備貨中','已出貨'];
const SHORT  = {'待下訂':'待訂','已下訂':'已訂','已集運':'集運','已抵台':'抵台','備貨中':'備貨','已出貨':'已出'};

const app = document.getElementById('app');
const meEl = document.getElementById('me');
let MODE = 'line';
let PROFILE = { userId:'', displayName:'' };

function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function money(n){ return '$' + (Number(n)||0).toLocaleString(); }
function loading(){ app.innerHTML = '<div class="spin"></div>'; }

// 點商品圖放大看清楚（原圖，不是縮圖）
function openLightbox(url){
  const box = document.createElement('div');
  box.className = 'lightbox';
  box.innerHTML = '<img src="'+esc(url)+'?tr=w-800" alt="">';
  box.onclick = () => box.remove();
  document.body.appendChild(box);
}

async function callGAS(action, payload={}){
  const res = await fetch(GAS_URL, {
    method:'POST',
    headers:{ 'Content-Type':'text/plain;charset=utf-8' },
    body: JSON.stringify({ api:true, action, ...payload })
  });
  const json = await res.json();
  if(!json || json.success===false) throw new Error((json && json.error) || 'API error');
  return json.data;
}

async function start(){
  loading();
  const liffReady = LIFF_ID && !LIFF_ID.startsWith('PASTE') && window.liff;
  if(liffReady){
    try{
      await liff.init({ liffId: LIFF_ID });
      if(!liff.isLoggedIn()){ liff.login(); return; }
      const p = await liff.getProfile();
      PROFILE = { userId:p.userId, displayName:p.displayName };
      MODE = 'line';
      renderMe(p.pictureUrl, p.displayName);
      // 加好友檢查：Partner mode 跳過（不引導加 OA）
      if (!IS_PARTNER) {
        try {
          const fr = await liff.getFriendship();
          if (fr && fr.friendFlag === false) { renderAddFriend(); return; }
        } catch(e) {}
      }
      await doLogin();
      return;
    }catch(e){}
  }
  MODE = 'preview';
  PROFILE = { userId:'', displayName:'' };
  renderSearch();
}

function renderMe(pic, name){
  meEl.innerHTML = (pic?'<img src="'+esc(pic)+'" alt="">':'') + '<span>'+esc(name||'')+'</span>';
}

/* 加好友引導（Partner mode 不顯示） */
function addFriendUrl(){
  if (IS_PARTNER) return '';
  const id = (OA_ID||'').trim();
  if(!id || id.indexOf('PASTE')===0) return '';
  return 'https://line.me/R/ti/p/' + encodeURIComponent(id);
}

function renderAddFriend(){
  if (IS_PARTNER) { doLogin(); return; } // Partner mode 跳過加好友
  const url = addFriendUrl();
  app.innerHTML =
    '<div class="card center">'
    + '<p style="font-size:44px;margin:8px 0 4px">💛</p>'
    + '<p style="font-weight:800;font-size:17px;margin:0 0 8px">先加好友</p>'
    + '<p class="muted" style="font-size:13px;line-height:1.8;margin:0 0 18px">加入官方帳號好友，<br>出貨、到貨的最新進度才能即時通知你 🚚</p>'
    + (url ? '<button class="btn block" id="addBtn">加入好友</button>' : '')
    + '<button class="btn ghost block" style="margin-top:10px" id="doneBtn">我加好友了，看訂單</button>'
    + '<button class="btn block" style="margin-top:10px;background:none;color:#b9b1a8;font-weight:700" id="skipBtn">先看訂單就好</button>'
    + '</div>';
  if(url){ document.getElementById('addBtn').onclick = ()=>{ try{ liff.openWindow({ url:url, external:true }); }catch(e){ location.href = url; } }; }
  document.getElementById('doneBtn').onclick = async ()=>{
    loading();
    try{ const fr = await liff.getFriendship(); if(fr && fr.friendFlag){ await doLogin(); return; } }catch(e){ await doLogin(); return; }
    renderAddFriend();
  };
  document.getElementById('skipBtn').onclick = ()=>{ doLogin(); };
}

function renderSearch(){
  const title = MODE==='preview' ? '預覽模式' : '重新搜尋';
  app.innerHTML =
    '<div class="card center">'
    + '<p style="font-weight:800;margin:4px 0 2px">'+title+'</p>'
    + '<p class="muted" style="font-size:13px;margin:0 0 14px">輸入你的暱稱或名字，查詢訂單狀態</p>'
    + '<input class="input" id="pv" placeholder="例如：Evan、拉拉、bob" />'
    + '<button class="btn block" style="margin-top:12px" id="pvBtn">查詢</button>'
    + '</div>';
  document.getElementById('pvBtn').onclick = ()=>{
    const v = document.getElementById('pv').value.trim();
    if(!v) return;
    PROFILE.displayName = v;
    doLogin();
  };
  document.getElementById('pv').addEventListener('keydown', e=>{ if(e.key==='Enter') document.getElementById('pvBtn').click(); });
}

async function doLogin(){
  loading();
  try{
    const r = await callGAS('customerLogin', { userId:PROFILE.userId, displayName:PROFILE.displayName });
    if(r.bound){ renderOrders(r.orders); return; }
    if(r.candidates && r.candidates.length){ renderCandidates(r.candidates); return; }
    renderNotFound();
  }catch(e){ renderError(e.message); }
}

function renderCandidates(cands){
  let html = '<div class="card">'
    + '<p style="font-weight:800;margin:2px 0 2px">請確認你是哪一位？</p>'
    + '<p class="muted" style="font-size:13px;margin:0 0 6px">點下面對應的名字，就能看到你的訂單</p>';
  cands.forEach((c,i)=>{
    html += '<div class="cand">'
      + '<div><b>'+esc(c.info)+'</b><div class="sub">'+c.orderCount+' 筆訂單</div></div>'
      + '<button class="btn" data-i="'+i+'">這是我</button>'
      + '</div>';
  });
  html += '<button class="btn ghost block" style="margin-top:14px" id="reSearch">都不是？換個名字找</button>';
  html += '</div>';
  app.innerHTML = html;
  app.querySelectorAll('.cand .btn').forEach(b=>{ b.onclick = ()=> pickCandidate(cands[Number(b.dataset.i)]); });
  document.getElementById('reSearch').onclick = ()=>{ renderSearch(); };
}

async function pickCandidate(c){
  loading();
  try{
    if(!PROFILE.userId){ renderNeedLine(); return; }
    const r = await callGAS('customerBind', { userId:PROFILE.userId, displayName:PROFILE.displayName, key:c.key, info:c.info });
    if(r && r.error){ renderMsg('⚠️', '無法綁定', r.error); return; }
    renderOrders(r.orders);
  }catch(e){ renderError(e.message); }
}

function renderMsg(emoji, title, sub){
  app.innerHTML = '<div class="card center"><p style="font-size:36px;margin:6px 0">'+emoji+'</p><p style="font-weight:800;margin:0 0 4px">'+esc(title)+'</p><p class="muted" style="font-size:13px;margin:0 0 14px">'+esc(sub||'')+'</p><button class="btn ghost" id="back">返回</button></div>';
  document.getElementById('back').onclick = ()=>{ renderSearch(); };
}

function renderNeedLine(){
  renderMsg('💬', '請從 LINE 開啟', '請透過 LINE 裡的查詢連結登入後查看');
}

function trackChips(trackingNumber){
  const tracks = String(trackingNumber||'').split(/\s*\/\s*/).map(s=>s.trim()).filter(Boolean);
  if(!tracks.length) return '';
  return tracks.map(t=>'<a class="track" href="https://myship.7-11.com.tw/seller/order/detail/'+encodeURIComponent(t)+'" target="_blank" rel="noreferrer">🚚 '+esc(t)+'</a>').join('');
}

function itemBlock(it){
  const isOut = it.stage==='斷貨';
  let steps = '';
  if(isOut){
    steps = '<span class="stockout">此商品已斷貨</span>';
  }else{
    const idx = STAGES.indexOf(it.stage);
    let segs='', labs='';
    STAGES.forEach((st,i)=>{
      segs += '<div class="seg '+(i<=idx?'on':'off')+'"></div>' + (i<STAGES.length-1?'<div style="width:3px"></div>':'');
      labs += '<span class="'+(i===idx?'cur':'')+'">'+SHORT[st]+'</span>';
    });
    steps = '<div class="steps">'+segs+'</div><div class="step-labels">'+labs+'</div>';
    // ✅ 改掛「包裹 N・日期」標籤，客人一眼看出同一張單為什麼分好幾次到
    if(it.stage==='已出貨'){
      const p = PKG_BY_TRACK[String(it.tracking||'').trim()];
      if(p) steps += '<div><span class="tag-pkg">包裹 '+p.no+(p.date?'・'+esc(shortDate(p.date)):'')+'</span></div>';
      else if(it.tracking) steps += trackChips(it.tracking);
    }
  }
  // ✅ 有商品圖才顯示縮圖（沒圖的舊商品不影響版面），用 ImageKit ?tr=w-100 拿小圖，不吃原圖流量
  const thumb = it.imageUrl ? '<img class="item-thumb" src="'+esc(it.imageUrl)+(it.imageUrl.indexOf('?')!==-1?'&':'?')+'tr=w-200" alt="" loading="lazy" onclick="openLightbox(\''+esc(it.imageUrl).replace(/'/g,"\\'")+'\')">' : '';
  return '<div class="item">'
    + '<div class="item-top">'
    + thumb
    + '<div style="flex:1;min-width:0"><div class="item-name">'+esc(it.name)+(it.spec?' <span class="muted" style="font-weight:500">('+esc(it.spec)+')</span>':'')+'</div></div>'
    + '<div class="item-qty">×'+(it.qty||1)+'</div></div>'
    + steps
    + '</div>';
}

// ✅ 依「物流單號」把所有已出貨商品分組 —— 同一個單號＝同一個包裹，
//    包裹可能橫跨多張訂單（併單只是合併收款，出貨本來就各走各的）
var PKG_BY_TRACK = {};   // tracking -> { no, date }
function buildPackages(orders){
  PKG_BY_TRACK = {};
  const map = {};
  (orders||[]).forEach(o=>{
    (o.items||[]).forEach(it=>{
      if(it.stage!=='已出貨') return;
      const tk = String(it.tracking||'').trim();
      if(!tk) return;
      if(!map[tk]) map[tk] = { tracking: tk, date: '', items: [] };
      map[tk].items.push({ orderId:o.id, name:it.name, spec:it.spec, qty:it.qty });
      const d = String(it.shipDate||'').trim();
      if(d && (!map[tk].date || d < map[tk].date)) map[tk].date = d;
    });
  });
  // 依出貨日由舊到新排序後編號。沒有日期的是「出貨日期」欄啟用前的歷史資料，
  // 一律當成最早的，排在最前面拿小編號 —— 這樣編號才會穩定，
  // 客人之後再回來看，「包裹 3」永遠是同一個包裹，不會因為又寄了新的就跳號
  const list = Object.keys(map).map(k=>map[k]).sort((a,b)=>{
    if(!a.date && !b.date) return 0;
    if(!a.date) return -1;
    if(!b.date) return 1;
    return a.date < b.date ? -1 : a.date > b.date ? 1 : 0;
  });
  list.forEach((p,i)=>{ p.no = i+1; PKG_BY_TRACK[p.tracking] = { no:p.no, date:p.date }; });
  return list;
}
function shortDate(d){
  const m = String(d||'').match(/(\d{1,2})\/(\d{1,2})$/);
  return m ? (m[1]+'/'+m[2]) : String(d||'');
}
// 預設展開幾個包裹（最新的在上面）；老客人累積幾十個包裹時不會把整頁佔滿
var PKG_SHOW = 3;
function pkgCard(p){
  const rows = p.items.map(x=>
    '<div>'+esc(x.name)+(x.spec?' <span class="muted">('+esc(x.spec)+')</span>':'')+' ×'+(x.qty||1)
    +' <span class="oid">'+esc(x.orderId)+'</span></div>').join('');
  return '<div class="pkg">'
    + '<div class="pkg-head"><span class="pkg-name">📦 包裹 '+p.no+'</span>'
    + (p.date?'<span class="pkg-date">'+esc(shortDate(p.date))+' 寄出</span>':'')
    + trackChips(p.tracking) + '</div>'
    + '<div class="pkg-list">'+rows+'</div></div>';
}
function packagesBlock(list){
  if(!list.length) return '';
  const newestFirst = list.slice().reverse();
  const recent = newestFirst.slice(0, PKG_SHOW);
  const older  = newestFirst.slice(PKG_SHOW);
  let h = '<p class="muted" style="font-size:13px;margin:16px 4px 2px">出貨進度（共 '+list.length+' 個包裹'
        + (older.length ? '，顯示最近 '+recent.length+' 個' : '') + '）</p>';
  h += recent.map(pkgCard).join('');
  if(older.length){
    h += '<button class="btn ghost block" id="showOldPkg" style="margin-top:8px">📦 查看更早的包裹（'+older.length+'）</button>';
    h += '<div id="oldPkgWrap"></div>';
    PKG_OLDER_HTML = older.map(pkgCard).join('');
  } else {
    PKG_OLDER_HTML = '';
  }
  return h;
}
var PKG_OLDER_HTML = '';

// ✅ 併單群組：同一個賣場連結＝尾款只收一次（跟出貨無關）
var MERGE_GROUPS = {};   // storeLink -> { ids:[], anchorId }
function buildMergeGroups(orders){
  MERGE_GROUPS = {};
  const g = {};
  (orders||[]).forEach(o=>{
    const k = String(o.storeLink||'').trim();
    if(!k) return;
    (g[k]=g[k]||[]).push(o);
  });
  Object.keys(g).forEach(k=>{
    if(g[k].length < 2) return;
    let anchor = null;
    g[k].forEach(o=>{ if((Number(o.remaining)||0) > 0 && !anchor) anchor = o; });
    MERGE_GROUPS[k] = { ids: g[k].map(o=>o.id), anchorId: anchor ? anchor.id : '' };
  });
}

function orderCard(o){
  const badge = o.shippingStatus==='已出貨' ? '<span class="badge b-done">🟢 已出貨</span>'
            : o.shippingStatus==='部分出貨' ? '<span class="badge b-part">🔵 部分出貨</span>'
            : '<span class="badge b-wait">🟠 備貨中</span>';
  const items = (o.items||[]).map(itemBlock).join('');
  const depositDue = Number(o.depositDue)||0;
  const unpaidDep = Math.max(0, depositDue - (Number(o.deposit)||0));
  const fullyShipped = o.shippingStatus==='已出貨';
  // ✅ 全部出貨＝尾款已由賣貨便貨到付款收走，視為已結清（跟 ERP 後台邏輯一致）
  const rem = fullyShipped ? 0 : (Number(o.remaining)||0);

  const rows = [];
  // 訂金那行：只有這張單真的需要收訂金時才顯示（VIP/批發訂金為0就跳過）
  if (depositDue > 0) {
    rows.push(unpaidDep > 0
      ? '<div class="money-row"><span class="lbl">訂金</span><span class="unpaid">待付 '+money(unpaidDep)+'</span></div>'
      : '<div class="money-row"><span class="lbl">訂金</span><span class="paid">✓ 已付清</span></div>');
  }
  // 尾款那行
  // ✅ 併單：尾款整筆掛在主單，其他單顯示「併入 ORDxxx 收取」而不是「已結清」
  //    寫已結清會讓客人以為自己付過了，事實上是由另一張單一起收
  const grp = MERGE_GROUPS[String(o.storeLink||'').trim()];
  if (rem > 0) {
    rows.push('<div class="money-row"><span class="lbl">尾款</span><span class="unpaid">待付 '+money(rem)+'</span></div>');
    if (grp && grp.anchorId === o.id) {
      rows.push('<div class="merge-note">取貨時付款・已含此次 '+grp.ids.length+' 張訂單</div>');
    }
  } else if (!fullyShipped && grp && grp.anchorId && grp.anchorId !== o.id) {
    rows.push('<div class="money-row"><span class="lbl">尾款</span><span class="muted">併入 '+esc(grp.anchorId)+' 收取</span></div>');
  } else {
    rows.push('<div class="money-row"><span class="lbl">尾款</span><span class="paid">✓ 已結清'+(fullyShipped?'（貨到付款）':'')+'</span></div>');
  }
  const due = '<div class="money-rows">' + rows.join('') + '</div>';
  return '<div class="card">'
    + '<div class="ord-head"><div><div class="ord-id">'+esc(o.id)+'</div><div class="ord-date">成立日 '+esc(o.createdAt||'')+'</div></div>'+badge+'</div>'
    + '<div style="margin-top:8px">'+items+'</div>'
    + '<div class="ord-foot"><span class="total">訂單總額 <b>'+money(o.total)+'</b></span>'+due+'</div>'
    + '</div>';
}

function renderOrders(orders){
  renderMe(null, PROFILE.displayName);
  if(!orders || !orders.length){
    app.innerHTML = '<div class="card center"><p style="font-size:40px;margin:6px 0">📦</p><p style="font-weight:800;margin:0 0 4px">目前沒有訂單</p><p class="muted" style="font-size:13px;margin:0">有新訂單後就會出現在這裡</p></div>';
    return;
  }
  const pkgs = buildPackages(orders);   // ✅ 要先建索引，itemBlock 和 orderCard 都會用到
  buildMergeGroups(orders);
  const open = orders.filter(o=>o.shippingStatus!=='已出貨');
  const done = orders.filter(o=>o.shippingStatus==='已出貨');
  let html = '';
  html += packagesBlock(pkgs);
  html += '<p class="muted" style="font-size:13px;margin:16px 4px 2px">訂單與付款・進行中（'+open.length+'）</p>';
  html += open.length ? open.map(orderCard).join('') : '<div class="card center muted" style="font-size:13px">沒有進行中的訂單 🎉</div>';
  if(done.length){
    html += '<p class="muted" style="font-size:13px;margin:22px 4px 2px">已完成（'+done.length+'）</p>';
    html += '<button class="btn ghost block" id="showPast" style="margin-top:4px">📦 查看過往訂單（'+done.length+'）</button>';
    html += '<div id="pastWrap"></div>';
  }
  app.innerHTML = html;
  var _pkgBtn = document.getElementById('showOldPkg');
  if(_pkgBtn) _pkgBtn.onclick = function(){
    document.getElementById('oldPkgWrap').innerHTML = PKG_OLDER_HTML;
    _pkgBtn.style.display = 'none';
  };
  if(done.length){
    var _btn = document.getElementById('showPast');
    if(_btn) _btn.onclick = function(){
      document.getElementById('pastWrap').innerHTML = done.map(orderCard).join('');
      _btn.style.display = 'none';
    };
  }
}

function renderNotFound(){
  app.innerHTML = '<div class="card center">'
    + '<p style="font-size:40px;margin:6px 0">🔍</p>'
    + '<p style="font-weight:800;margin:0 0 4px">找不到你的訂單</p>'
    + '<p class="muted" style="font-size:13px;margin:0 0 14px">可能是暱稱跟訂單上的名字不同，換個名字試試</p>'
    + '<button class="btn ghost block" id="retry">換個名字找</button>'
    + '</div>';
  document.getElementById('retry').onclick = ()=>{ renderSearch(); };
}

function renderError(msg){
  app.innerHTML = '<div class="card center"><p style="font-size:36px;margin:6px 0">⚠️</p><p style="font-weight:800;margin:0 0 4px">連線出了點問題</p><p class="muted" style="font-size:12px;word-break:break-all;margin:0 0 14px">'+esc(msg||'')+'</p><button class="btn ghost" onclick="start()">重新整理</button></div>';
}

start();
</script>
</body>
</html>
