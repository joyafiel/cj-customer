<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CJ Studio 小幫手</title>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<style>
:root{ --brand:#8C7B6C; --brand-dark:#6f6052; --cream:#FDFBF7; --line:#ece7df; --ink:#3d3a36; --muted:#9b938a; }
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
body{ margin:0; font-family:-apple-system,"PingFang TC","Noto Sans TC",Roboto,sans-serif;
      background:var(--cream); color:var(--ink); }
header{ position:sticky; top:0; z-index:5; background:var(--cream); padding:14px 16px 10px;
        border-bottom:1px solid var(--line); }
.t{ font-weight:800; letter-spacing:.5px; font-size:15px; }
.s{ font-size:10px; color:var(--muted); letter-spacing:2px; font-weight:500; }
.asof{ float:right; font-size:10.5px; color:var(--muted); font-weight:500; }
.tabs{ display:flex; gap:6px; padding:10px 10px 0; background:var(--cream);
       position:sticky; top:57px; z-index:5; }
.tab{ flex:1; border:1px solid var(--line); background:#fff; border-radius:12px 12px 0 0;
      border-bottom:none; padding:8px 2px 7px; font:inherit; font-size:11px; font-weight:700;
      color:var(--muted); cursor:pointer; text-align:center; line-height:1.35; }
.tab.on{ background:var(--brand); color:#fff; border-color:var(--brand); }
.tab b{ display:block; font-size:13px; }
main{ background:#fff; border-top:1px solid var(--line); padding:12px; min-height:60vh; }
.search{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px;
         font:inherit; font-size:14px; outline:none; margin-bottom:10px; }
.search:focus{ border-color:var(--brand); }
.sum{ background:var(--cream); border:1px solid var(--line); border-radius:12px;
      padding:9px 11px; font-size:11.5px; color:var(--brand-dark); margin-bottom:10px; font-weight:700; }
.row{ border:1px solid var(--line); border-radius:12px; padding:9px 11px; margin-bottom:7px; }
.row.tap{ cursor:pointer; }
.row.tap:active{ background:var(--cream); }
.n{ font-size:12.5px; font-weight:700; line-height:1.5; word-break:break-all; }
.m{ font-size:10.5px; color:var(--muted); margin-top:3px; display:flex; gap:10px; flex-wrap:wrap; }
.qty{ font-size:12px; font-weight:800; color:var(--brand); white-space:nowrap; }
.fx{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.chip{ font-size:9.5px; font-weight:800; padding:2px 6px; border-radius:6px; white-space:nowrap; }
.c-wait{ background:#FFF4E5; color:#C8741A; } .c-ok{ background:#E9F7EC; color:#2E8B45; }
.c-ship{ background:#E9F1FF; color:#2E6BD6; } .c-dead{ background:#f2f2f2; color:#bbb; }
.btn{ display:block; width:100%; border:0; border-radius:12px; padding:11px; font:inherit;
      font-size:13.5px; font-weight:700; background:var(--brand); color:#fff; cursor:pointer; }
.btn.ghost{ background:#fff; color:var(--brand); border:1px solid var(--line); }
.btn:active{ transform:scale(.99); }
.warn{ background:#FBECEC; border:1px solid #ecd4d4; border-radius:12px; padding:10px 12px;
        font-size:12px; line-height:1.8; color:#8a4a4a; margin-bottom:10px; }
.warn b{ color:#A8403F; }
.mini{ display:block; width:100%; margin-top:8px; border:1px solid #e0bcbc; background:#fff;
       color:#A8403F; border-radius:9px; padding:7px; font:inherit; font-size:11.5px;
       font-weight:700; cursor:pointer; }
.row.ghost{ background:#FFF8F8; border-color:#f0d8d8; }
.c-ghost{ background:#FBECEC; color:#A8403F; }
.empty{ text-align:center; color:var(--muted); font-size:12.5px; padding:34px 14px; line-height:1.9; }
pre.rc{ white-space:pre-wrap; word-break:break-all; font:inherit; font-size:11px; line-height:1.8;
        background:var(--cream); border:1px solid var(--line); border-radius:12px;
        padding:11px; margin:0 0 9px; max-height:40vh; overflow:auto; }
.spin{ width:28px; height:28px; border:3px solid var(--line); border-top-color:var(--brand);
       border-radius:50%; animation:sp 1s linear infinite; margin:40px auto; }
@keyframes sp{ to{ transform:rotate(360deg); } }
.err{ background:#FBECEC; border:1px solid #ecd4d4; border-radius:14px; padding:16px;
      font-size:12.5px; line-height:1.9; color:#8a4a4a; }
.err b{ color:#A8403F; }

/* ── 記帳（資金往來）────────────────────────────── */
.fbal{ background:var(--cream); border:1px solid var(--line); border-radius:14px;
       padding:14px 13px; margin-bottom:4px; }
.fbal .cap{ font-size:10px; letter-spacing:2px; color:var(--muted); font-weight:700; }
.fbal .big{ font-size:30px; font-weight:800; line-height:1.25; letter-spacing:-.5px;
            font-variant-numeric:tabular-nums; color:#A8403F; }
.fbal .big.pos{ color:#2E8B45; }
.fbal .say{ font-size:12px; font-weight:700; margin-top:1px; }
.fbal .sub{ font-size:10.5px; color:var(--muted); margin-top:3px; }
.flab{ font-size:11px; font-weight:800; color:var(--brand-dark); margin:13px 0 6px; letter-spacing:.5px; }
.flab span{ font-weight:500; color:var(--muted); }
.fchips{ display:flex; flex-wrap:wrap; gap:5px; }
.fc{ border:1px solid var(--line); background:#fff; color:var(--ink); font:inherit;
     font-size:11.5px; font-weight:700; padding:7px 10px; border-radius:999px; cursor:pointer; }
.fc.on.in{ background:#E9F7EC; color:#2E8B45; border-color:#2E8B45; }
.fc.on.out{ background:#FBECEC; color:#A8403F; border-color:#A8403F; }
.fc.sm{ font-size:11px; padding:5px 9px; font-weight:600; }
.fc.sm.on{ background:var(--brand); color:#fff; border-color:var(--brand); }
.fin{ width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:12px;
      font:inherit; font-size:14px; outline:none; background:#fff; color:var(--ink); }
.fin:focus{ border-color:var(--brand); }
.fmoney{ display:flex; align-items:center; gap:8px; }
.fmoney .fsym{ font-size:21px; font-weight:800; color:var(--muted); width:18px; text-align:center; }
.fmoney .fin{ flex:1; min-width:0; font-size:24px; font-weight:800; text-align:right;
              font-variant-numeric:tabular-nums; }
.frow2{ display:flex; gap:7px; }
.frow2 .fin{ flex:1; min-width:0; font-size:13px; }
.fprev{ border:1px dashed var(--line); border-radius:12px; padding:10px 11px; margin:13px 0 10px; }
.fprev .cap{ font-size:9.5px; letter-spacing:1.5px; color:var(--muted); font-weight:700; margin-bottom:5px; }
.fprev .ln{ display:flex; justify-content:space-between; gap:9px; align-items:baseline;
            font-size:12.5px; font-weight:700; }
.fprev .am{ font-variant-numeric:tabular-nums; white-space:nowrap; }
.fprev .am.in{ color:#2E8B45; } .fprev .am.out{ color:#A8403F; }
.fprev .mm{ font-size:10.5px; color:var(--muted); margin-top:3px; word-break:break-all; }
.fok{ background:#E9F7EC; border:1px solid #bfe3c8; color:#2E8B45; border-radius:12px;
      padding:9px 11px; font-size:11.5px; font-weight:700; margin-top:9px; line-height:1.7; }
.fitem{ border-top:1px solid var(--line); padding:9px 2px; }
.fitem .fa{ font-variant-numeric:tabular-nums; font-size:13px; font-weight:800; white-space:nowrap; }
.fitem .fa.in{ color:#2E8B45; } .fitem .fa.out{ color:#A8403F; }
.ftag{ font-size:9px; font-weight:800; padding:1px 5px; border-radius:5px;
       background:var(--cream); color:var(--muted); margin-right:5px; }
</style>
</head>
<body>
<header>
  <span class="asof" id="asof"></span>
  <div class="t">CJ STUDIO</div>
  <div class="s">小幫手</div>
</header>
<div class="tabs" id="tabs"></div>
<main id="main"><div class="spin"></div></main>

<script>
/* ============================================================
   CJ Studio · 小幫手頁　2026/10/24

   🔴 這一頁會顯示**全部客人的訂單和金額**，所以：
      ・身分一律由伺服器驗（LIFF ID Token → LINE 官方驗簽 → 比對 STAFF_LINE_IDS）
      ・前端送的 userId 不算數，伺服器根本不看
      ・「網址沒人知道」不是保護，白名單才是

   資料層只有一份：GAS 的 _staffTodoRaw_()。
   LINE 文字版、Flex 摘要卡、這一頁，三個出口都吃它 ——
   不要在這裡自己算任何數字。
   ============================================================ */

/* ✅ 已填好（2026/11/03）：給「小幫手頁」用的 LIFF ID（跟客人查單頁**不同**一支）
      channel 2008786061 ＝ 小幫手的 LINE Login channel，
      跟 cj_staff.gs 的 STAFF_CH_FALLBACK_ 是同一個，對得起來。
      LINE Developers → 你的 LINE Login channel → LIFF → Add
        Endpoint URL : 這一頁的網址（例如 https://cj-customer.vercel.app/staff.html）
        Size         : Full
        Scopes       : profile ＋ **openid**  ← 🔴 沒勾 openid 就拿不到 ID Token
*/
const LIFF_ID = "2008786061-A5sC4A4C";

const GAS_URL = "https://script.google.com/macros/s/AKfycbzVrGHrtZh44PSTDA8K58opzMUFOshKwh8b9EA72D9kRI4f-dvGvCfmxbDir2_4aXNfSQ/exec";
const API_TIMEOUT_MS = 30000;   // 這一頁要掃 Order_Items 全表，比客人頁慢，給寬一點

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const nf = (n) => '$' + Number(n || 0).toLocaleString();

let TOKEN = '';          // LIFF ID Token
let DATA = null;         // getStaffAll 的結果
let TAB = 'todo', Q = '', PICKED = null, DETAIL = null, ONLY_GHOST = false;

/* 記帳分頁。FUND 是伺服器回來的 { total, count, rows, cats, sheetName }。
   🔴 類別清單**不在這裡寫第二份** —— 跟 cj_資金往來.gs 拿，全系統只有一個定義。 */
let FUND = null, FUND_ERR = '', FUND_CAT = '', FUND_MSG = '', FUND_FAIL = '', FUND_BUSY = false;
let STAGE = 'boot';

/* ── 呼叫 GAS ─────────────────────────────────── */
async function callGAS(action, payload){
  STAGE = 'api:' + action;
  const ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  const timer = ctrl ? setTimeout(() => ctrl.abort(), API_TIMEOUT_MS) : null;
  let res;
  try{
    res = await fetch(GAS_URL, {
      method:'POST',
      headers:{ 'Content-Type':'text/plain;charset=utf-8' },
      body: JSON.stringify({ api:true, action, payload: Object.assign({ idToken: TOKEN }, payload || {}) }),
      signal: ctrl ? ctrl.signal : undefined
    });
  }catch(e){
    if(timer) clearTimeout(timer);
    const aborted = e && (e.name === 'AbortError');
    throw new Error(aborted ? '伺服器回應太慢（超過 ' + (API_TIMEOUT_MS/1000) + ' 秒）' : '連線失敗：' + ((e && e.message) || e));
  }
  if(timer) clearTimeout(timer);
  const text = await res.text();
  if(!res.ok) throw new Error('伺服器回應 ' + res.status);
  let json;
  try{ json = JSON.parse(text); }
  catch(e){ throw new Error('回應格式異常：' + String(text).replace(/<[^>]*>/g,' ').trim().slice(0,60)); }
  if(!json || json.success === false) throw new Error((json && json.error) || 'API error');
  // 🔴 data 是 undefined 代表那個 action 在 GAS 沒被接到（dispatch 漏了）。
  //    伺服器會照樣回 success:true —— 2026/10/24 被這個騙了一整天，這裡擋住。
  if(json.data === undefined) throw new Error('伺服器沒有處理 ' + action + '（code.gs 的 dispatch 可能漏了這一行）');
  if(json.data && json.data.ok === false) throw new Error(json.data.error || '沒有權限');
  return json.data;
}

/* ── 畫面 ─────────────────────────────────────── */
const TABS = () => [
  { k:'todo', t:'待叫件', n: DATA ? DATA.todo.length : '' },
  { k:'pack', t:'可包貨', n: DATA ? DATA.pack.length : '' },
  { k:'cust', t:'查單',   n: '' },
  { k:'pay',  t:'待收款', n: DATA ? DATA.customers.filter(c => c.gap > 0).length : '' },
  { k:'fund', t:'記帳',   n: '' }
];

function drawTabs(){
  $('tabs').innerHTML = TABS().map(t =>
    '<button class="tab' + (TAB===t.k?' on':'') + '" data-k="' + t.k + '">'
    + '<b>' + (t.n === '' ? '·' : t.n) + '</b>' + t.t + '</button>').join('');
  Array.from(document.querySelectorAll('.tab')).forEach(b =>
    b.onclick = () => {
      TAB = b.dataset.k; Q=''; PICKED=null; DETAIL=null; ONLY_GHOST=false; FUND_MSG='';
      draw();
      // 記帳的資料是另一張試算表，而且不是每個小幫手都能看 ——
      // 所以開機不抓，點進去才抓。
      if(TAB === 'fund' && !FUND && !FUND_ERR) loadFund();
    });
}

function listView(arr, unit){
  const q = Q.trim();
  let f = q ? arr.filter(x => (x.name + x.spec + x.sku).indexOf(q) !== -1) : arr;

  // 🔴 2026/10/24：「0 位客人」＝ 那一列明細的訂單編號在 Order_Management 裡找不到，
  //    或那張單的顧客資訊是空的。不管哪一種，**它背後沒有人在等這個商品**。
  //
  //    這種列會害你照著待叫件去叫一個沒有人要的貨 —— 錢花出去、東西到了才發現
  //    沒有訂單可以對。不會報錯、不會壞掉，只會燒錢，所以一定要在畫面上吼出來。
  //
  //    這不是這一頁造成的，是它讓人看見的 —— LINE 的今日待辦一直都含這些，
  //    只是文字版沒有「N 位客人」這一欄。
  const ghosts = arr.filter(x => !x.customers);
  if(ONLY_GHOST) f = f.filter(x => !x.customers);

  const n = f.reduce((s,x)=>s+x.qty,0);
  return '<input class="search" id="q" placeholder="搜尋商品或款號…" value="' + esc(Q) + '">'
    + (ghosts.length
        ? '<div class="warn">🔴 有 <b>' + ghosts.length + ' 種 / '
          + ghosts.reduce((s,x)=>s+x.qty,0) + ' 件</b>找不到對應的客人。'
          + '<br>叫貨前先確認，不然會買到沒有人要的東西。'
          + '<button class="mini" id="gf">' + (ONLY_GHOST ? '← 看全部' : '只看這些') + '</button></div>'
        : '')
    + '<div class="sum">' + (ONLY_GHOST ? '🔴 只看沒有客人的　' : q ? '找到 ' : '共 ')
      + f.length + ' 種 / ' + n + ' 件'
      + ((q || ONLY_GHOST) ? '　（全部 ' + arr.length + ' 種）' : '') + '</div>'
    + (f.length ? f.map(x =>
        '<div class="row' + (x.customers ? '' : ' ghost') + '"><div class="fx">'
        + '<div><div class="n">' + esc(x.name) + (x.spec ? ' (' + esc(x.spec) + ')' : '') + '</div>'
        + '<div class="m"><span>' + esc(x.sku) + '</span>'
        + (x.customers
            ? '<span>' + x.customers + ' 位客人</span>'
            : '<span class="chip c-ghost">🔴 沒有客人，先別叫</span>') + '</div></div>'
        + '<div class="qty">' + x.qty + ' ' + unit + '</div>'
        + '</div></div>').join('')
      : '<div class="empty">沒有符合的商品</div>');
}

const CHIP = (s) => (s === '已抵台' || s === '備貨中') ? 'c-ok'
                  : (s === '已出貨' || s === '斷貨')   ? 'c-dead'
                  : (s === '已集運')                  ? 'c-ship' : 'c-wait';

function custList(){
  const q = Q.trim();
  const f = (DATA.customers || []).filter(c => !q || c.name.indexOf(q) !== -1 || c.key.indexOf(q) !== -1);
  return '<input class="search" id="q" placeholder="搜尋客人…" value="' + esc(Q) + '">'
    + '<div class="sum">' + f.length + ' 位客人有未出貨訂單</div>'
    + (f.length ? f.map(c =>
        '<div class="row tap" data-c="' + esc(c.key) + '"><div class="fx">'
        + '<div><div class="n">' + esc(c.name) + '</div>'
        + '<div class="m"><span>' + c.orders + ' 張單</span><span>總額 ' + nf(c.total) + '</span>'
        + '<span>已收 ' + nf(c.paid) + '</span></div></div>'
        + '<div class="qty"' + (c.gap > 0 ? ' style="color:#C8741A"' : '') + '>'
        + (c.gap > 0 ? '還缺 ' + nf(c.gap) : '✅') + '</div>'
        + '</div></div>').join('')
      : '<div class="empty">沒有符合的客人</div>');
}

function custDetail(){
  const os = DETAIL.orders || [];
  if(!os.length) return '<button class="btn ghost" id="back" style="margin-bottom:10px">← 回客人清單</button>'
    + '<div class="empty">這位客人沒有未出貨的訂單</div>';

  const total = os.reduce((s,o)=>s+o.total,0);
  const due   = os.reduce((s,o)=>s+o.due,0);
  const paid  = os.reduce((s,o)=>s+o.paid,0);
  const rem   = os.reduce((s,o)=>s+o.rem,0);
  // 🔴 依「賣場連結」分組，並把各組自己的待收尾款加起來。
  //
  //    客人要的是「我要去哪幾個賣場、各付多少」。一個賣場 ＝ 一個包裹 ＝ 一筆運費。
  //    不要用訂單張數或寄件批次來講 —— 批次是你內部的分法，
  //    客人看得到的只有賣場連結。還沒開賣場的那幾張要單獨講，不能混進去。
  //
  //    金額一律用伺服器回來的 rem（試算表的「待收尾款」），這裡不重算。
  //    ERP 那邊是 splitMergedDeposits 算好寫進去的，照抄才不會兩邊不一致。
  const byLink = []; let pending = 0;
  os.forEach(o => {
    if(!o.link){ pending += (Number(o.rem) || 0); return; }
    let g = byLink.filter(x => x.link === o.link)[0];
    if(!g){ g = { link:o.link, rem:0 }; byLink.push(g); }
    g.rem += (Number(o.rem) || 0);
  });

  // 🔴 對帳單文字：金額全部用伺服器回來的值，這裡不重算。
  //    ERP 那邊是用 splitMergedDeposits 算好寫進試算表的，照抄才不會兩邊不一致。
  const items = [];
  os.forEach(o => (o.items||[]).forEach(i => { if(i.status !== '斷貨') items.push(i); }));
  const receipt =
'您好\n以下為您本期結算的訂單內容及結帳金額（共 ' + os.length + ' 筆訂單）\n\n'
+ '訂購品項：\n'
+ items.map(i => '　' + i.name + (i.spec ? '（' + i.spec + '）' : '') + ' X' + i.qty).join('\n')
+ '\n\n訂單總額：' + nf(total) + '\n\n確認下單流程：\n1. 匯款商品訂金：' + nf(due) + '\n'
// 🔴 等號右邊只能是「上面列出來的那幾個賣場」加起來，不能用整組的 rem ——
//    還沒開賣場的那幾張是分開講的，混進來就會變成 $0 ＋ $20 ＝ $40 這種對不起來的算式。
//    客人看到加不起來的數字，後面寫什麼都不會信。
+ (byLink.length > 1
   ? '\n2. 取貨時付：' + byLink.map(g => nf(g.rem)).join(' ＋ ')
     + ' ＝ ' + nf(byLink.reduce((s,g) => s + g.rem, 0))
     + '\n這次分 ' + byLink.length + ' 個包裹寄出，各自取貨時付一筆 🚚\n\n'
     + byLink.map((g,i) => '📮 第 ' + (i+1) + ' 批｜取貨時付 ' + nf(g.rem) + '\n' + g.link).join('\n\n')
     + (pending > 0 ? '\n\n📦 另外還有 ' + nf(pending) + ' 的商品還在備貨，到齊後會再把連結給您' : '')
   : byLink.length === 1
     ? '\n2. 尾款 ' + nf(byLink[0].rem) + ' 將於取貨時以貨到付款支付\n賣貨便下單連結：\n' + byLink[0].link
       + (pending > 0 ? '\n\n📦 另外還有 ' + nf(pending) + ' 的商品還在備貨，到齊後會再把連結給您' : '')
     : '\n2. 尾款 ' + nf(rem) + ' 將於取貨時以貨到付款支付\n（賣場還沒開，開好會把連結給您）')
+ '\n\n再麻煩您幫我們完成下單流程，會再更新貨況給您，感謝支持☺️';

  return '<button class="btn ghost" id="back" style="margin-bottom:10px">← 回客人清單</button>'
    + '<div class="sum">' + esc(DETAIL.name) + '　' + os.length + ' 張單<br>'
    + '總額 ' + nf(total) + '・已收 ' + nf(paid) + '・應收訂金 ' + nf(due) + '・取貨時付 ' + nf(rem) + '</div>'
    + os.map(o =>
        '<div class="row"><div class="fx">'
        + '<div><div class="n">' + esc(o.id) + '</div>'
        + '<div class="m"><span>' + esc(o.createdAt) + '</span><span>' + nf(o.total) + '</span>'
        + (o.track ? '<span>' + esc(o.track) + '</span>' : '') + '</div></div>'
        + '<div class="qty">訂金 ' + nf(o.due) + '</div></div>'
        + (o.items||[]).map(i =>
            '<div class="fx" style="margin-top:5px;font-size:11px;align-items:baseline">'
            + '<span style="flex:1' + (i.status==='斷貨'?';color:#ccc;text-decoration:line-through':'') + '">'
            +   esc(i.name) + (i.spec ? '（' + esc(i.spec) + '）' : '') + (i.qty>1 ? ' ×' + i.qty : '') + '</span>'
            + '<span class="chip ' + CHIP(i.status) + '">' + esc(i.status) + '</span></div>').join('')
        + '</div>').join('')
    + '<div class="sum" style="margin-top:12px">對帳單（可直接貼給客人）</div>'
    + '<pre class="rc" id="rc">' + esc(receipt) + '</pre>'
    + '<button class="btn" id="cp">📋 複製對帳單</button>';
}

function payView(){
  const rows = (DATA.customers || []).filter(c => c.gap > 0);
  const owe = rows.reduce((s,c)=>s+c.gap,0);
  if(!rows.length) return '<div class="empty">✅ 沒有人欠訂金</div>';
  return '<div class="sum">' + rows.length + ' 位未結清・訂金缺口合計 ' + nf(owe) + '</div>'
    + rows.map(c =>
        '<div class="row tap" data-c="' + esc(c.key) + '"><div class="fx">'
        + '<div><div class="n">' + esc(c.name) + '</div>'
        + '<div class="m"><span>' + c.orders + ' 張單</span><span>應收 ' + nf(c.due) + '</span>'
        + '<span>已收 ' + nf(c.paid) + '</span></div></div>'
        + '<div class="qty" style="color:#C8741A">還缺 ' + nf(c.gap) + '</div>'
        + '</div></div>').join('');
}

/* ── 記帳（資金往來）──────────────────────────────
   設計重點：
   ① 符號由類別決定，人只輸入正數 —— 打錯正負號這件事直接消失。
   ② 類別清單從伺服器來（FUND.cats），這一頁不自己寫一份。
   ③ 送出前有一行預覽，長得跟會寫進試算表的那一列一模一樣。
   🔴 ④ 改輸入時**只更新預覽那幾個節點**，不重畫整頁 ——
         重畫會讓手機鍵盤收起來、游標跳掉。
   ================================================= */

async function loadFund(){
  FUND_ERR = '';
  try{
    FUND = await callGAS('getFundList', {});
    if(FUND && FUND.cats && FUND.cats.length && !FUND_CAT){
      // 預設停在最常用的那個（她絕大多數是付貨款出去）
      const def = FUND.cats.filter(c => c.k === '貨款支出')[0] || FUND.cats[0];
      FUND_CAT = def.k;
    }
  }catch(e){
    FUND = null;
    FUND_ERR = (e && e.message) || String(e);
  }
  draw();
}

function fundCat(){
  if(!FUND || !FUND.cats) return null;
  return FUND.cats.filter(c => c.k === FUND_CAT)[0] || null;
}

/* 常用對象：類別自己帶的，加上最近明細裡真的出現過的（照她的實際資料長出來，
   不是我寫死一份名單，所以她換廠商不用改程式）。*/
function fundParties(C){
  const seen = {}, out = [];
  (C.parties || []).forEach(p => { if(p && !seen[p]){ seen[p] = 1; out.push(p); } });
  const wantIn = C.dir > 0;
  (FUND.rows || []).forEach(r => {
    if(wantIn ? !(r.a > 0) : !(r.a < 0)) return;
    const name = wantIn ? r.b : r.c;
    if(!name || name === 'Joya' || seen[name]) return;
    seen[name] = 1; out.push(name);
  });
  return out.slice(0, 14);
}

function fundMemo(){
  const C = fundCat();
  let m = ($('fMemo') ? $('fMemo').value : '').trim();
  if(C && C.period && $('fFrom') && $('fTo')){
    const f = $('fFrom').value, t = $('fTo').value;
    if(f && t){
      const sh = s => { const p = s.split('-'); return (+p[1]) + '/' + (+p[2]); };
      const tag = sh(f) + '-' + sh(t);
      m = m ? (tag + ' ' + m) : (tag + ' ' + C.k);
    }
  }
  return m;
}

function fundPreview(){
  const C = fundCat();
  if(!C || !$('fPvAmt')) return;
  const party = $('fParty').value.trim();
  const raw = Math.abs(Math.round(Number($('fAmt').value) || 0));
  const isIn = C.dir > 0;

  $('fPvWho').textContent = isIn ? ((party || '？') + ' → Joya') : ('Joya → ' + (party || '？'));
  $('fPvAmt').textContent = raw ? ((isIn ? '' : '-') + raw.toLocaleString()) : '—';
  $('fPvAmt').className = 'am ' + (isIn ? 'in' : 'out');
  $('fPvMemo').textContent = fundMemo();

  Array.from(document.querySelectorAll('[data-fp]')).forEach(b =>
    b.className = 'fc sm' + (b.dataset.fp === party ? ' on' : ''));

  $('fGo').disabled = FUND_BUSY || !party || !raw;
  $('fGo').textContent = FUND_BUSY ? '送出中…' : '送出';
}

function fundView(){
  if(FUND_ERR){
    return '<div class="warn"><b>記帳打不開</b><br>' + esc(FUND_ERR).replace(/\n/g,'<br>') + '</div>'
         + '<button class="btn ghost" id="fRetry">再試一次</button>';
  }
  if(!FUND) return '<div class="spin"></div>';

  const C = fundCat();
  const t = Number(FUND.total) || 0;
  const neg = t < 0;

  let h = '';
  if(FUND_FAIL){
    h += '<div class="warn"><b>沒有記進去</b><br>' + esc(FUND_FAIL).replace(/\n/g,'<br>')
       + '<br><br>試算表沒有被改到，直接再送一次就好。</div>';
  }

  h += '<div class="fbal">'
    + '<div class="cap">目前款項</div>'
    + '<div class="big' + (neg ? '' : ' pos') + '">' + (neg ? '-' : '') + Math.abs(t).toLocaleString() + '</div>'
    + '<div class="say">' + (neg ? ('克勞要補給我 ' + nf(-t)) : ('我手上還有克勞的 ' + nf(t))) + '</div>'
    + '<div class="sub">' + FUND.count + ' 筆往來 · ' + esc(FUND.sheetName || '') + ' · ' + esc(FUND.asOf || '') + '</div>'
    + '</div>';

  h += '<div class="flab">類別 <span>正負號由類別決定，你只填正數</span></div><div class="fchips">'
     + FUND.cats.map(c =>
         '<button class="fc ' + (c.dir > 0 ? 'in' : 'out') + (c.k === FUND_CAT ? ' on' : '')
         + '" data-fk="' + esc(c.k) + '">' + (c.dir > 0 ? '＋' : '−') + esc(c.k) + '</button>').join('')
     + '</div>';

  if(C){
    h += '<div class="flab">' + (C.dir > 0 ? '誰給的' : '付給誰')
       + (C.hint ? ' <span>' + esc(C.hint) + '</span>' : '') + '</div>';
    const ps = fundParties(C);
    if(ps.length){
      h += '<div class="fchips" style="margin-bottom:7px">'
         + ps.map(p => '<button class="fc sm" data-fp="' + esc(p) + '">' + esc(p) + '</button>').join('')
         + '</div>';
    }
    h += '<input class="fin" id="fParty" type="text" autocomplete="off" placeholder="或直接打名字"'
       + ' value="' + esc(C.period && C.parties && C.parties[0] ? C.parties[0] : '') + '">';

    h += '<div class="flab">金額</div>'
       + '<div class="fmoney"><span class="fsym" id="fSym">' + (C.dir > 0 ? '＋' : '−') + '</span>'
       + '<input class="fin" id="fAmt" type="number" inputmode="numeric" min="0" step="1" placeholder="0"></div>';

    if(C.period){
      h += '<div class="flab">期間 <span>會自動寫進備註</span></div>'
         + '<div class="frow2"><input class="fin" id="fFrom" type="date" aria-label="期間起">'
         + '<input class="fin" id="fTo" type="date" aria-label="期間迄"></div>';
    }

    const now = new Date();
    const pad = n => (n < 10 ? '0' : '') + n;
    const today = now.getFullYear() + '-' + pad(now.getMonth()+1) + '-' + pad(now.getDate());

    h += '<div class="flab">備註</div>'
       + '<input class="fin" id="fMemo" type="text" autocomplete="off" placeholder="買了什麼、給誰的">'
       + '<div class="flab">日期</div>'
       + '<input class="fin" id="fDate" type="date" value="' + today + '">';

    h += '<div class="fprev"><div class="cap">會寫進試算表的這一列</div>'
       + '<div class="ln"><span id="fPvWho">—</span><span class="am" id="fPvAmt">—</span></div>'
       + '<div class="mm" id="fPvMemo"></div></div>'
       + '<button class="btn" id="fGo" disabled>送出</button>';

    if(FUND_MSG) h += '<div class="fok">' + esc(FUND_MSG) + '</div>';
  }

  h += '<div class="flab" style="margin-top:18px">最近的往來</div>';
  h += (FUND.rows || []).slice(0, 25).map(r => {
    const isIn = r.a > 0;
    return '<div class="fitem"><div class="fx">'
      + '<div style="min-width:0"><div class="n">' + esc(r.b) + ' → ' + esc(r.c) + '</div>'
      + (r.m ? '<div class="m"><span>' + esc(r.m) + '</span></div>' : '') + '</div>'
      + '<div style="text-align:right"><div class="fa ' + (isIn ? 'in' : 'out') + '">'
      + (isIn ? '+' : '-') + Math.abs(r.a).toLocaleString() + '</div>'
      + '<div class="m" style="justify-content:flex-end">' + esc(r.d) + '</div></div>'
      + '</div></div>';
  }).join('') || '<div class="empty">還沒有紀錄</div>';

  return h;
}

async function fundSubmit(){
  const C = fundCat();
  if(!C || FUND_BUSY) return;
  const party = $('fParty').value.trim();
  const raw = Math.abs(Math.round(Number($('fAmt').value) || 0));
  if(!party || !raw) return;

  FUND_BUSY = true; FUND_MSG = ''; FUND_FAIL = '';
  fundPreview();
  try{
    const r = await callGAS('addFundEntry', {
      cat: C.k, party: party, amount: raw,
      memo: fundMemo(), date: $('fDate').value
    });
    FUND.total = r.total != null ? r.total : FUND.total;
    if(r.dup){
      FUND_MSG = '這一筆剛剛已經記過了，沒有重複寫。';
    }else{
      if(r.row){ FUND.rows.unshift(r.row); FUND.count = (FUND.count || 0) + 1; }
      FUND_MSG = '✓ 已記一筆　' + (C.dir > 0 ? '＋' : '−') + raw.toLocaleString() + '　' + C.k
               + '\n已經寫進試算表了。';
    }
  }catch(e){
    // 🔴 失敗要存進狀態讓 fundView 畫出來，不能直接塞進 DOM ——
    //    後面那個 draw() 會把塞進去的東西整個洗掉，變成「失敗了畫面卻什麼都不說」。
    FUND_MSG = '';
    FUND_FAIL = (e && e.message) || String(e);
  }
  FUND_BUSY = false;
  draw();
}

function wireFund(){
  if($('fRetry')) $('fRetry').onclick = () => { FUND_ERR = ''; FUND = null; draw(); loadFund(); };

  Array.from(document.querySelectorAll('[data-fk]')).forEach(b =>
    b.onclick = () => { FUND_CAT = b.dataset.fk; FUND_MSG = ''; draw(); });

  if(!$('fParty')) return;

  Array.from(document.querySelectorAll('[data-fp]')).forEach(b =>
    b.onclick = () => { $('fParty').value = b.dataset.fp; fundPreview(); });

  // 🔴 只更新預覽，不重畫 —— 重畫會把鍵盤收起來
  ['fParty','fAmt','fMemo','fFrom','fTo'].forEach(id => {
    if($(id)) $(id).oninput = fundPreview;
  });
  $('fGo').onclick = fundSubmit;
  fundPreview();
}

function draw(){
  drawTabs();
  if(!DATA){ $('main').innerHTML = '<div class="spin"></div>'; return; }
  $('asof').textContent = '更新於 ' + DATA.asOf;
  $('main').innerHTML =
      TAB === 'todo' ? listView(DATA.todo, '件')
    : TAB === 'pack' ? listView(DATA.pack, '件')
    : TAB === 'cust' ? (DETAIL ? custDetail() : custList())
    : TAB === 'fund' ? fundView()
    :                  payView();

  if(TAB === 'fund') wireFund();

  const q = $('q');
  if(q) q.oninput = () => {
    Q = q.value; const p = q.selectionStart; draw();
    const n2 = $('q'); if(n2){ n2.focus(); try{ n2.setSelectionRange(p,p); }catch(e){} }
  };
  if($('gf')) $('gf').onclick = () => { ONLY_GHOST = !ONLY_GHOST; draw(); };
  Array.from(document.querySelectorAll('[data-c]')).forEach(el =>
    el.onclick = () => openCustomer(el.dataset.c));
  if($('back')) $('back').onclick = () => { DETAIL = null; draw(); };
  if($('cp')) $('cp').onclick = () => {
    const t = $('rc').textContent;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(()=>{ $('cp').textContent = '✅ 已複製'; setTimeout(()=>{ $('cp').textContent='📋 複製對帳單'; },1800); })
      .catch(()=>{ $('cp').textContent = '複製失敗 —— 長按上面的文字手動選取'; });
  };
}

async function openCustomer(key){
  const c = (DATA.customers||[]).filter(x => x.key === key)[0];
  TAB = 'cust'; Q = '';
  $('main').innerHTML = '<div class="spin"></div>';
  try{
    const r = await callGAS('getStaffCustomer', { key: key });
    DETAIL = { name: c ? c.name : key, orders: r.orders || [] };
    draw();
  }catch(e){ showErr(e); }
}

function showErr(e){
  const msg = (e && e.message) || String(e);

  // 🔴 伺服器說過期 → 自己換一張，不要把這種訊息丟給使用者看。
  //    （上面那段是「送出前」就擋掉；這裡是「伺服器那邊才判定過期」的補網。）
  if(/expired/i.test(msg) && typeof liff !== 'undefined' && liff.login){
    if(reloginGuard()){
      $('main').innerHTML = '<div class="spin"></div>'
        + '<p class="empty">身分證明過期了，重新登入一下…</p>';
      liff.login({ redirectUri: location.href });
      return;
    }
    $('main').innerHTML = '<div class="err">'
      + '<p style="margin:0 0 8px"><b>⚠️ 身分一直驗不過</b></p>'
      + '<p style="margin:0 0 10px;font-size:11.5px">換了新的身分證明還是說過期，'
      + '最常見的原因是**手機時間不準**。請到設定把日期與時間改成「自動設定」，再開一次。</p>'
      + '<button class="btn ghost" onclick="location.reload()">重新整理</button></div>';
    return;
  }
  $('main').innerHTML = '<div class="err">'
    + '<p style="margin:0 0 8px"><b>⚠️ ' + esc(msg) + '</b></p>'
    + '<p style="margin:0 0 10px;font-size:11.5px">[' + esc(STAGE) + ']</p>'
    + (/只有 CJ 小幫手|STAFF_LINE_IDS/.test(msg)
        ? '<p style="margin:0 0 10px;font-size:11.5px">在 GAS 跑 <b>RUN_檢查白名單</b> 看看 '
          + 'STAFF_LINE_IDS 是不是完整的 33 個字。</p>' : '')
    + (/dispatch/.test(msg)
        ? '<p style="margin:0 0 10px;font-size:11.5px">code.gs 要加這兩行：<br>'
          + '<code style="font-size:10.5px">getStaffAll</code> 和 '
          + '<code style="font-size:10.5px">getStaffCustomer</code> 的 dispatch</p>' : '')
    + '<button class="btn ghost" onclick="location.reload()">重新整理</button>'
    + '</div>';
}

/* ── ID Token 的有效期限 ──────────────────────── */

/**
 * JWT 的中間那段是 base64url 編碼的 JSON，裡面有 exp（到期時間，秒）。
 *
 * 🔴 只用正規表示式撈 exp 這個數字，不做完整 JSON.parse ——
 *    payload 裡有使用者名稱，可能含中文／emoji，atob 出來的位元組直接 JSON.parse
 *    會因為編碼問題炸掉。我們只要一個數字，不需要為它處理 UTF-8。
 */
function jwtExp(t){
  try{
    const b = String(t).split('.')[1];
    if(!b) return 0;
    const raw = atob(b.replace(/-/g,'+').replace(/_/g,'/'));
    const m = raw.match(/"exp"\s*:\s*(\d+)/);
    return m ? Number(m[1]) : 0;
  }catch(e){ return 0; }
}
// 剩不到 2 分鐘就當作過期 —— 免得送出的路上剛好跨過期限
function tokenExpiringSoon(t){
  const exp = jwtExp(t);
  if(!exp) return false;                       // 讀不出來就別亂跳，交給伺服器判斷
  return (exp * 1000 - Date.now()) < 120000;
}

/* 防迴圈：重新登入最多一次。liff.login() 會重載頁面，所以狀態要存在 sessionStorage。
   （存不進去也不能讓整頁掛掉 —— 無痕模式、封鎖網站資料都會讓它丟例外） */
const RG = 'cjStaffRelogin';
function reloginGuard(){
  try{
    if(sessionStorage.getItem(RG)) return false;   // 已經換過一次了，不要再跳
    sessionStorage.setItem(RG, '1');
  }catch(e){}
  return true;
}
function clearReloginGuard(){ try{ sessionStorage.removeItem(RG); }catch(e){} }

/* ── 啟動 ─────────────────────────────────────── */
(async function start(){
  try{
    if(!LIFF_ID || LIFF_ID.indexOf('PASTE') === 0){
      throw new Error('還沒設定小幫手頁的 LIFF_ID（檔案第 ~95 行）');
    }
    STAGE = 'liff.init';
    await liff.init({ liffId: LIFF_ID });
    if(!liff.isLoggedIn()){ liff.login(); return; }

    STAGE = 'liff.getIDToken';
    TOKEN = liff.getIDToken() || '';
    // 🔴 拿不到 token 幾乎都是 LIFF 沒勾 openid scope。講清楚，不要只說「驗證失敗」。
    if(!TOKEN) throw new Error('拿不到 ID Token —— LIFF 的 Scopes 要勾 openid（LINE Developers 裡改）');

    // 🔴 ID Token 會過期，而且 LIFF **不會自動換新的**。
    //
    //    過期的徵狀是伺服器回「IdToken expired」—— 看起來像設定壞了，
    //    其實只是頁面開太久、或上次登入隔了一段時間。
    //    與其讓你看到一串嚇人的錯誤訊息，不如在送出前先看一眼有效期限，
    //    快過期就自己重新登入換一張。
    //
    //    ⚠️ liff.login() 會讓頁面重新載入，所以一定要有防迴圈 ——
    //       萬一換完還是過期（例如裝置時間不對），就不要一直跳。
    if(tokenExpiringSoon(TOKEN)){
      if(!reloginGuard()){
        throw new Error('身分一直驗不過，可能是手機時間不準。請確認時間設為自動，再開一次。');
      }
      STAGE = 'liff.login(換新的身分證明)';
      liff.login({ redirectUri: location.href });
      return;
    }
    clearReloginGuard();

    DATA = await callGAS('getStaffAll', {});
    draw();
  }catch(e){ showErr(e); }
})();
</script>
